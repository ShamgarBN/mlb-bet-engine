[project]
name = "mlb-model"
version = "0.1.0"
description = "MLB prediction & betting model. Free-data, walk-forward backtested, honestly calibrated."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Family Budget Owner" }]
license = { text = "MIT" }
keywords = ["mlb", "baseball", "betting", "machine-learning", "statcast"]

dependencies = [
    # ----- Core scientific stack -----
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    # ----- ML / stats -----
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "statsmodels>=0.14",
    # ----- Baseball / sports data -----
    "pybaseball>=2.2.7",
    "MLB-StatsAPI>=1.7.2",
    # ----- HTTP / scraping / caching -----
    "httpx>=0.27",
    "requests>=2.32",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "tenacity>=9.0",
    # ----- Config / logging -----
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.8",
    "python-dotenv>=1.0",
    # ----- Date / timezone -----
    "python-dateutil>=2.9",
    "pytz>=2024.2",
    # ----- Plotting / notebooks -----
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[project.scripts]
mlb-model = "mlb_model.cli:app"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
